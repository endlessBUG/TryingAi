server:
  port: 8080

spring:
  servlet:
    multipart:
      max-file-size: 10GB
      max-request-size: 10GB
  datasource:
    url: jdbc:sqlite:${user.home}/ai/trainer/trainer.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: false

storage:
  type: local

trainer:
  ai-toolkit-path: ./ai-toolkit
  python-path: python
  data-dir: ${user.home}/ai/trainer
  upload-dir: ${user.home}/ai/trainer/uploads
  dataset-dir: ${user.home}/ai/trainer/datasets
  output-dir: ${user.home}/ai/trainer/outputs
  config-dir: ${user.home}/ai/trainer/configs
  log-dir: ${user.home}/ai/trainer/logs
  model-dir: ${user.home}/ai/trainer/models
  supported-formats: jpg,jpeg,png,webp,bmp
  max-concurrent-tasks: 2
  default-conda-env: wan22

logging:
  level:
    com.ai.trainer: DEBUG
