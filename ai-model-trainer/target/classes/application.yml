server:
  port: 8080

spring:
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  datasource:
    url: jdbc:sqlite:${user.home}/tryingai/trainer.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: false

storage:
  type: local

trainer:
  ai-toolkit-path: ./ai-toolkit
  python-path: python
  data-dir: ${user.home}/tryingai
  upload-dir: ${user.home}/tryingai/uploads
  dataset-dir: ${user.home}/tryingai/datasets
  output-dir: ${user.home}/tryingai/outputs
  config-dir: ${user.home}/tryingai/configs
  log-dir: ${user.home}/tryingai/logs
  supported-formats: jpg,jpeg,png,webp,bmp
  max-concurrent-tasks: 2

logging:
  level:
    com.ai.trainer: DEBUG
